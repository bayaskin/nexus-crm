name: nexus-platform

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: nexus-proxy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    networks: [nexus]
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nexus-web
    environment:
      VITE_API_BASE_URL: /api
    expose: ["5173"]
    networks: [nexus]
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nexus-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-nexus}:${MYSQL_PASSWORD:-nexus_dev_password}@mysql:3306/${MYSQL_DATABASE:-nexus_crm}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY; generate one with openssl rand -hex 32}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      TEMPORARY_PASSWORD_HOURS: ${TEMPORARY_PASSWORD_HOURS:-24}
      EXPOSE_TEMPORARY_PASSWORDS: ${EXPOSE_TEMPORARY_PASSWORDS:-false}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-nexus@localhost}
      APP_LOGIN_URL: ${APP_LOGIN_URL:-http://localhost:8080/login}
    expose: ["8000"]
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [nexus, data]
    restart: unless-stopped
    volumes:
      - ./apps/api:/app

  mysql:
    image: mysql:8.4
    container_name: nexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nexus-mailhog
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
    expose: ["1025"]
    networks: [nexus]
    restart: unless-stopped

  # Run on demand: docker compose --profile test run --rm ui-tests
  ui-tests:
    profiles: [test]
    build:
      context: ./automation/ui
    environment:
      BASE_URL: http://proxy
      TEST_USER_EMAIL: ${TEST_USER_EMAIL}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD}
    depends_on:
      proxy:
        condition: service_started
    networks: [nexus]

  # Run on demand: docker compose --profile test run --rm api-tests
  api-tests:
    profiles: [test]
    build:
      context: ./automation/api
    environment:
      BASE_URL: http://api:8000
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      TEST_USER_EMAIL: ${TEST_USER_EMAIL:-}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-}
      TEST_RBAC_PASSWORD: ${TEST_RBAC_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
    networks: [nexus, data]
    volumes:
      - ./automation/api:/tests

volumes:
  mysql_data:

networks:
  nexus:
    driver: bridge
  data:
    driver: bridge
    internal: true
